<!DOCTYPE html>
<html lang="fr">
  <head>
    <title>Requête invalide (400) - Greginos</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
      body {
        background-color: #f8f9fa;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Poppins', sans-serif;
      }
      .error-container {
        text-align: center;
        padding: 2rem;
        background: white;
        border-radius: 1rem;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
        max-width: 600px;
        width: 90%;
      }
      .error-icon {
        font-size: 5rem;
        color: #dc3545;
        margin-bottom: 1rem;
      }
      .error-title {
        color: #212529;
        font-size: 2rem;
        margin-bottom: 1rem;
      }
      .error-message {
        color: #6c757d;
        margin-bottom: 2rem;
      }
      .btn-home {
        background-color: #0d6efd;
        color: white;
        padding: 0.75rem 1.5rem;
        border-radius: 0.5rem;
        text-decoration: none;
        transition: all 0.2s ease;
      }
      .btn-home:hover {
        background-color: #0b5ed7;
        transform: translateY(-2px);
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="error-container">
      <i class="bi bi-exclamation-octagon error-icon"></i>
      <h1 class="error-title">Requête invalide</h1>
      <p class="error-message">La requête envoyée au serveur n'est pas valide. Veuillez vérifier les informations saisies.</p>
      <a href="/" class="btn-home">
        <i class="bi bi-house-door me-2"></i>Retour à l'accueil
      </a>
    </div>
  </body>
</html>
